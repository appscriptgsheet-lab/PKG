    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var fetchHolder = origFetch;
          var fetchProp = {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchHolder;
            },
            set: function(val) {
              fetchHolder = val;
            }
          };
          try {
            Object.defineProperty(window, 'fetch', fetchProp);
          } catch (_) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchProp);
            } catch (_) {}
          }
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1)
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reasonStr = (e && e.reason) ? String(e.reason) : '';
          if (
            reasonStr.indexOf('chrome-extension://') !== -1 ||
            reasonStr.indexOf('Cannot set property fetch') !== -1
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
